# Windows 11 style touchpad gestures (KDE Plasma, X11) for libinput-gestures
# Two-finger scroll, two-finger tap (right click) and pinch-to-zoom are handled by libinput itself.
#
# 3 fingers up          -> Task View (KDE Overview)
# 3 fingers down        -> Show desktop
# 3 fingers left/right  -> Switch apps (Alt+Tab)
# 3 fingers hold (tap)  -> Search (KRunner), like Windows 3-finger tap
# 4 fingers left/right  -> Switch virtual desktop
# 4 fingers up / down   -> Task View / Show desktop
gesture swipe up    3 xdotool key super+Tab
gesture swipe down  3 xdotool key super+d
gesture swipe left  3 xdotool key alt+shift+Tab
gesture swipe right 3 xdotool key alt+Tab
gesture hold  on    3 xdotool key alt+space
gesture swipe left  4 xdotool key super+ctrl+Right
gesture swipe right 4 xdotool key super+ctrl+Left
gesture swipe up    4 xdotool key super+Tab
gesture swipe down  4 xdotool key super+d
